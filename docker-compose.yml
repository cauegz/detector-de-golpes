services:
  backend:
    image: eclipse-temurin:21-jdk
    container_name: detector-golpes-backend
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - detector-network

  frontend:
    image: node:22-alpine
    container_name: detector-golpes-frontend
    working_dir: /app
    volumes:
      - ./frontend/detector-de-golpes:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - detector-network

volumes:
  maven-cache:
  frontend-node-modules:

networks:
  detector-network:
    driver: bridge