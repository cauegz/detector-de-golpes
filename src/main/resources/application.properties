spring.config.import=optional:file:.env[.properties]
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.max-output-tokens=500
spring.ai.google.genai.chat.response-mime-type=application/json

# O SDK do Google faz as tentativas HTTP. Evita uma segunda camada de retries no Spring AI.
spring.ai.retry.max-attempts=1

#o unico que ta funcionando é o 3.5 flash lite(meia hora tentando)
